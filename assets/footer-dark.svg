<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 92" width="1200" height="92" role="img">
<defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5a0" stop-opacity="0.275"/>
      <stop offset="55%" stop-color="#4cc4ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4cc4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5a0" stop-opacity="0"/>
      <stop offset="18%" stop-color="#00e5a0" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#4cc4ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f778ba" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#243040" fill-opacity="0.55"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="91" rx="14" fill="#0d1117" stroke="#243040"/>
  <rect x="0" y="0" width="1200" height="92" rx="14" fill="url(#dots)" opacity="0.35"/>
  <rect x="40" y="30" width="1120" height="2" fill="url(#rule)"/>
  <text x="40" y="68" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15">
    <tspan fill="#00e5a0" font-weight="600">$</tspan><tspan fill="#e6edf3" opacity="0.82"> exit  #  thanks for scrolling — issues &amp; PRs welcome</tspan>
  </text>
  <rect x="535" y="56" width="9" height="15" fill="#00e5a0" rx="1">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.15s" repeatCount="indefinite" calcMode="discrete"/>
  </rect>
</svg>
