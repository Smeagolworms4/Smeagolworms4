name: Refresh profile assets

# Regenerates the SVG assets from the public GitHub API so the numbers on the
# profile never go stale. Runs daily, on push to the script, and on demand.
on:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/generate.mjs'
      - '.github/workflows/refresh-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate.mjs

      - name: Commit if anything moved
        run: |
          if [ -z "$(git status --porcelain assets)" ]; then
            echo "assets unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore(assets): refresh profile stats"
          git push
